<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiteBox | Contact</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <!-- Restaurant Name -->
    <header>

        <h1>Contact</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <main>
        <hr>
        <h2>Customer Registration & Order Form</h2>
        <form action="">
            <h3>Customer Information</h3>
            <label for="fullname">Full name</label>
            <br>
            <input type="text" id="fullname" name="fullname">
            <br><br>
            <label for="email">Email Address</label>
            <br>
            <input type="email" id="email" name="email">
            <br><br>
            <label for="password">Password</label>
            <br>
            <input type="password" name="password" id="password">
            <br><br>
            <label for="phone">Phone Number</label>
            <br>
            <input type="tel" name="phone" id="phone">
            <br><br>

            <h3>Order Information</h3>
            <label for="quantity">Quantity</label>
            <br>
            <input type="number" name="quantity" id="quantity">
            <br><br>

            <label for="deliveryDate">Preferred Delivery Date</label>
            <br>
            <input type="date" id="deliveryDate" name="deliveryDate">
            <br><br>

            <label for="food">Selet Food Item</label>
            <select name="food" id="food">
                <option value="">Veg pizza</option>
                <option value="">Cheese Burger</option>
                <option value="">White Sauce Pasta</option>
                <option value="">Veg Grilled Sandwich</option>
                <option value="">Chocolate Brownie</option>
            </select>
            <br><br>
            <h3>Payment Method</h3>
            <input type="radio" id="cash" name="payment">
            <label for="cash">Cash</label>
            <br>
            <input type="radio" id="card" name="payment">
            <label for="card">Card</label>
            <br>
            <input type="radio" id="upi" name="payment">
            <label for="upi">UPI</label>
            </select>

            <h3>Extras</h3>
            <input type="checkbox" id="cheese" name="extras">
            <label for="cheese">Extra Cheese</label>
            <br>
            <input type="checkbox" id="drink" name="extras">
            <label for="drink">Cold Drink</label>
            <br>
            <input type="checkbox" id="dessert" name="extras">
            <label for="dessert">Dessert</label>
            <br><br>

            <h3>Delivery Instructions</h3>
            <label for="address">Delivery Address</label>
            <br>
            <textarea name="address" id="address" rows="5" cols="40" placeholder="Enter Your Address for delivery"></textarea>
            <br>
            <input type="submit" value="Place Order">
            <input type="reset" value="Clear Order">
        </form>
    </main>
</body>

</html>
